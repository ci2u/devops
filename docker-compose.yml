services:
  app:
    build:
      context: ./app
      args:
        APP_VERSION: compose
    ports:
      - "8080:8080"
    environment:
      GREETING: "Hello from Docker Compose"
      REDIS_HOST: redis
    depends_on: 
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data: