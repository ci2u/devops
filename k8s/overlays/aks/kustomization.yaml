apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base                   # start from the base

images:
  - name: hello-devops       # wherever the base uses this image...
    newName: acrdevopslabc84d9.azurecr.io/hello-devops   # <- your ACR login server
    newTag: "1.0.3"

patches:
  - target:
      kind: Service
      name: hello-devops
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
